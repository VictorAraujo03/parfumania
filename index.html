    <title>Parfumania</title>
    <style id="splash-css">
      /* Tela de carregamento (frasco borrifando). Usada também pelo componente SplashScreen. */
      .splash {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        background: radial-gradient(60% 45% at 50% 40%, rgba(201,169,110,0.12) 0%, transparent 70%), #0d0c0b;
        color: #ede8df; animation: splash-in 300ms ease-out both;
      }
      .splash__art { width: min(62vw, 250px); height: auto; overflow: visible; }
      .splash__name {
        margin: 6px 0 0; font-family: 'Cormorant Garamond', 'Times New Roman', serif;
        font-size: 30px; font-weight: 600; letter-spacing: 0.06em; color: #ede8df;
      }
      .splash__label {
        margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 12px;
        letter-spacing: 0.14em; text-transform: uppercase; color: #a9a297;
      }
      .sp-pump { animation: sp-press 2.4s cubic-bezier(.4,0,.2,1) infinite; }
      .sp-mist {
        fill: #e2c48c; opacity: 0; transform-box: fill-box; transform-origin: center;
        animation: sp-mist 2.4s ease-out infinite;
      }
      .sp-cloud {
        fill: #d9b877; opacity: 0; filter: blur(7px); transform-box: fill-box; transform-origin: left center;
        animation: sp-cloud 2.4s ease-out infinite;
      }
      .sp-liquid { fill: rgba(201,169,110,0.4); animation: sp-wave 2.4s ease-in-out infinite; }
      @keyframes sp-press {
        0%, 10% { transform: translateY(0); }
        16% { transform: translateY(6px); }
        28%, 100% { transform: translateY(0); }
      }
      @keyframes sp-mist {
        0%, 15% { opacity: 0; transform: translate(0, 0) scale(0.4); }
        19% { opacity: 1; }
        45% { opacity: 0.75; }
        78%, 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.5); }
      }
      @keyframes sp-cloud {
        0%, 16% { opacity: 0; transform: translateX(-30px) scale(0.3); }
        32% { opacity: 0.4; }
        85%, 100% { opacity: 0; transform: translateX(26px) scale(1.9); }
      }
      @keyframes sp-wave {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-28px); }
      }
      @keyframes splash-in { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .sp-pump, .sp-liquid, .sp-cloud { animation: none; }
        .sp-mist { animation: none; opacity: 0.5; transform: translate(var(--dx), var(--dy)); }
      }
    </style>
  </head>
